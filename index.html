<script>
/* Shared simulation. World coordinates are measured in maze cells, time in seconds. */
(function (global) {
  'use strict';
  const TAU = Math.PI * 2, WALL = .075, BODY = .181, SHOT = .033, STEP = 1 / 120;
  const SEEKER_DELAY = 2;
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const angleDiff = (a, b) => Math.atan2(Math.sin(a-b), Math.cos(a-b));
  const dist = (a,b) => Math.hypot(a.x-b.x,a.y-b.y);
  const ITEMS = {
    shield: ['护盾','抵挡一次命中'], rapid: ['连发','按住扫射，松开即结束，最长 3 秒'],
    triple: ['三连发','一次射出三颗扇形弹'], laser: ['激光','瞬发光束，最多反弹六次'],
    seeker: ['追踪弹',`直飞 ${SEEKER_DELAY} 秒，碰墙反弹，随后追踪最近的存活坦克；尾烟显示目标颜色`], frag: ['破片弹','命中或飞行 1.1 秒时炸成十二片，碎片碰墙即消失'],
    mine: ['地雷','车尾布雷，离开后感应引爆']
  };
  const randomInt = n => Math.floor(Math.random()*n);
  class Maze {
    constructor(cols, rows) {
      this.cols=cols; this.rows=rows;
      this.links=Array.from({length:cols*rows},()=>[]);
      const edges=[];
      for(let i=0;i<this.links.length;i++){
        if(i%cols<cols-1)edges.push([i,i+1]);
        if(Math.floor(i/cols)<rows-1)edges.push([i,i+cols]);
      }
      for(let i=edges.length-1;i>0;i--){const j=randomInt(i+1);[edges[i],edges[j]]=[edges[j],edges[i]];}
      const parent=this.links.map((_,i)=>i);
      function find(i){while(parent[i]!==i){parent[i]=parent[parent[i]];i=parent[i];}return i;}
      this.walls=[];
      const wall=(x1,y1,x2,y2)=>this.walls.push({x1:x1-WALL/2,y1:y1-WALL/2,x2:x2+WALL/2,y2:y2+WALL/2});
      for(const [a,b] of edges){
        const p=find(a),q=find(b);
        if(p!==q || Math.random()<.18){parent[p]=q;this.links[a].push(b);this.links[b].push(a);}
        else {const x=a%cols,y=Math.floor(a/cols); if(b===a+1)wall(x+1,y,x+1,y+1);else wall(x,y+1,x+1,y+1);}
      }
      wall(0,0,cols,0);wall(0,rows,cols,rows);wall(0,0,0,rows);wall(cols,0,cols,rows);
    }
    cell(p){return clamp(Math.floor(p.x),0,this.cols-1)+this.cols*clamp(Math.floor(p.y),0,this.rows-1);}
    center(i){return {x:i%this.cols+.5,y:Math.floor(i/this.cols)+.5};}
    route(start,end){
      const prev=new Int16Array(this.links.length).fill(-1), queue=[start]; prev[start]=start;
      for(let k=0;k<queue.length && prev[end]===-1;k++)
        for(const n of this.links[queue[k]])if(prev[n]===-1){prev[n]=queue[k];queue.push(n);}
      const result=[];for(let i=end;i!==start;i=prev[i])result.push(i);
      return result.reverse();
    }
    /* Intersect the swept point with walls expanded by the object's radius. */
    cast(x,y,dx,dy,limit,r=0,walls=this.walls){
      let best=null, nearest=limit;
      for(const w of walls){
        const l=w.x1-r,h=w.x2+r,t=w.y1-r,b=w.y2+r;
        if(Math.abs(dx)<1e-10 && (x<l || x>h))continue;
        if(Math.abs(dy)<1e-10 && (y<t || y>b))continue;
        const ax=Math.abs(dx)<1e-10?-Infinity:((dx>0?l:h)-x)/dx;
        const bx=Math.abs(dx)<1e-10?Infinity:((dx>0?h:l)-x)/dx;
        const ay=Math.abs(dy)<1e-10?-Infinity:((dy>0?t:b)-y)/dy;
        const by=Math.abs(dy)<1e-10?Infinity:((dy>0?b:t)-y)/dy;
        const enter=Math.max(ax,ay),leave=Math.min(bx,by);
        if(enter<-.000001 || leave<enter || enter>nearest+.000001)continue;
        const nx=ax>=ay-.000001?-Math.sign(dx):0,ny=ay>=ax-.000001?-Math.sign(dy):0;
        if(best && Math.abs(enter-nearest)<.000001){best.nx ||= nx;best.ny ||= ny;}
        else {nearest=Math.max(0,enter);best={d:nearest,nx,ny};}
      }
      return best;
    }
    fits(x,y,r,walls=this.walls){
      for(const w of walls){
        if(x<=w.x1-r || x>=w.x2+r || y<=w.y1-r || y>=w.y2+r)continue;
        const dx=x-clamp(x,w.x1,w.x2),dy=y-clamp(y,w.y1,w.y2);
        if(dx*dx+dy*dy<r*r)return false;
      }
      return true;
    }
    visible(a,b,r=0){
      const d=dist(a,b);return d<.00001 || !this.cast(a.x,a.y,(b.x-a.x)/d,(b.y-a.y)/d,d,r);
    }
  }
  function circleHit(x,y,dx,dy,tank,r){
    const ox=tank.x-x,oy=tank.y-y,along=ox*dx+oy*dy;
    const discr=r*r-(ox*ox+oy*oy-along*along);
    if(discr<0 || along+Math.sqrt(discr)<0)return Infinity;
    return Math.max(0,along-Math.sqrt(discr));
  }
  const idle=()=>({drive:0,turn:0,held:false,press:0});
  function createPilot(level,id){
    return ['medium','hard'].includes(level) ? new global.TankPilot(level,id) : new EasyPilot(id);
  }
  class Game {
    constructor(options={}){

<script>

      this.depth = this.deadEnds();

    flood(start) {

      const queue = [start];

        const current = queue[index];
        for (const next of this.maze.links[current]) {
          if (cost[next] >= 0) continue;
          cost[next] = cost[current] + 1;
          queue.push(next);
        }
      }
      return cost;
    }

    deadEnds() {
      const links = this.maze.links;

          if(!walkable(maze,me,first)){

      const empty=(!me.item || me.item==='shield' || me.item==='mine') && game.count(me.id)===5;
      if (!locked.length && !empty) return null;

      const pursuers=empty ? game.tanks.filter(t=>t!==me && t.alive &&

          routes.push({points,value:choice.value});

      const atlas = this.atlas;
      const maze = game.maze;
      const here = maze.cell(me);
      const there = maze.cell(enemy);
      const remaining = atlas.range(here, there);
      if (remaining < 2 || remaining > 11) return null;
      const likely = forecasts[0]?.line[9] || enemy;
      const future = maze.cell(likely);
      let best = null;
      for (const cell of atlas.options(here, 3)) {
        if (cell === here || cell === there) continue;
        const travel = atlas.range(here, cell);
        const after = atlas.range(cell, future);
        if (after >= remaining || after > 5) continue;
        if (!atlas.cellSight(cell, future)) continue;
        const p = atlas.centers[cell];
        const flank = Math.abs(angleDiff(bearing(enemy, p), enemy.a));
        const legs = maze.links[cell].length;
        const value = 1.65 + Math.min(1.6, flank) * .38 + Math.min(legs, 3) * .18 -
          travel * .36 - after * .11 - atlas.depth[cell] * .24;
        if (!best || value > best.value) best = { kind: 'intercept', target: p, value };
      }
      return best;
    }

    unstick(game, me, enemy, canShoot) {
      if (canShoot) {
        this.watch = { x: me.x, y: me.y, at: game.time };
        return null;
      }
      const maze = game.maze;
      const cell = maze.cell(me);
      if (game.time < this.stallUntil && this.detour !== cell) {
        return { kind: 'reposition', target: this.atlas.centers[this.detour], value: 3 };
      }
      if (game.time - this.watch.at < 1.7) return null;
      const there = maze.cell(enemy);
      const neighbors = maze.links[cell];
      let best = null;
      for (const n of neighbors) {
        const revisited = Math.max(0, 3 - (game.time - this.visits[n]));
        const score = -this.atlas.range(n, there) * .38 - revisited +
          (walkable(maze, me, this.atlas.centers[n]) ? .9 : 0);
        if (!best || score > best.score) best = { n, score };
      }
      this.watch = { x: me.x, y: me.y, at: game.time };
      this.detour = best.n;
      this.stallUntil = game.time + .85;
      return { kind: 'reposition', target: this.atlas.centers[best.n], value: 3 };
    }

    select(game, me, enemy, forecasts, shot) {
      this.observe(game, me);
      const ammo = 5 - game.count(me.id);
      const special = me.item && me.item !== 'shield';
      const killWindow = shot && shot.value > .74;
      let target = null;
      const item = enemy.alive ? this.pickup(game, me, enemy) : null;
      if (item && ['laser','shield'].includes(item.target.kind) && item.value > 1.6 &&

        target = this.refuge(game, me, enemy);
      } else {
        if (item && item.value > (killWindow ? 2.7 : .65)) target = item;
        if (!target && !shot?.viable) target = this.unstick(game, me, enemy, false);
        if (!target && shot?.viable) this.unstick(game, me, enemy, true);
        if (!target && !game.maze.visible(me, enemy) && !shot?.viable) {

            dist(me, this.goal.target) > .32) {
            target = this.goal;
          } else {

            if (intercept && intercept.value > .95) {

              this.until = game.time + .48;
            }

      }
      if (!target) target = { kind: 'advance', target: enemy };
      this.goal = target;

  // A segment of a forecast tank path and a segment of shell flight must

  function crossing(line, path, speed, duration, delay) {

      const start = s.start / speed;
      const stop = Math.min(s.end / speed, duration);
      if (stop <= start) continue;
      const first = Math.floor((start + delay) / H);
      const last = Math.min(line.length - 1, Math.ceil((stop + delay) / H));
      for (let j = first; j < last; j++) {
        const lo = Math.max(start, j * H - delay);
        const hi = Math.min(stop, (j + 1) * H - delay);
        if (hi <= lo) continue;
        const a = line[j], b = line[j + 1];
        const fx = b.x - a.x, fy = b.y - a.y;
        const fraction = (lo + delay) / H - j;
        const x = s.x + s.dx * (lo * speed - s.start) - a.x - fx * fraction;
        const y = s.y + s.dy * (lo * speed - s.start) - a.y - fy * fraction;
        const dt = hi - lo;
        const dx = (s.dx * speed - fx / H) * dt;
        const dy = (s.dy * speed - fy / H) * dt;
        const u = clamp(-(x * dx + y * dy) / (dx * dx + dy * dy || 1), 0, 1);
        const gapX = x + u * dx, gapY = y + u * dy;
        const d2 = gapX * gapX + gapY * gapY;

          time = lo + u * dt;

  function returnTime(shooter, path, speed) {

      const deltaY = shooter.y - s.y;

  class AimAngles {
    constructor() {

    add(a) {

  class FireControl {

      this.ready = opponent.alive && (game.count(opponent.id) < 5 ||
        (opponent.item && opponent.item !== 'shield'));

      for (const s of path) {
        const from = s.start / speed + delay;
        const to = s.end / speed + delay;
        const low = Math.max(0, Math.floor(from / H));
        const high = Math.min(this.steps, Math.ceil(to / H));

          const a = Math.max(j * H, from);
          const b = Math.min((j + 1) * H, to);

          const d1 = (b - delay) * speed - s.start;

            p: { x: s.x + s.dx * d0, y: s.y + s.dy * d0 },
            q: { x: s.x + s.dx * d1, y: s.y + s.dy * d1 },
            lo: a / H - j,

      if (distance > 6) return;

      const delays = rapid ? [.04,.18,.36] : [this.playerFiring ? 0 : .14];
      const offsets = this.foe.item === 'triple' ? [-.18, 0, .18] : [0];

          b.right = Math.max(b.p.x, b.q.x) + margin;
          b.top = Math.min(b.p.y, b.q.y) - margin;
          b.bottom = Math.max(b.p.y, b.q.y) + margin;
          left = Math.min(left, b.left);
          right = Math.max(right, b.right);
          top = Math.min(top, b.top);

        const y = p.y + dy * b.lo - b.p.y;

/* Static broad phase for the many hypothetical physics calls made during
   a decision. It only selects candidate walls. The narrow phase remains
   Maze.cast / Maze.fits, exactly as used by the running game. */
(function (global) {
  'use strict';
  const { BODY, clamp } = TankArena;
  const padding = BODY + .10;

  class PlanningScene {
    constructor(game) {
      this.source = game.maze;
      this.width = this.source.cols;
      this.height = this.source.rows;
      this.buckets = [];
      this.small = [];
      this.stamp = 0;
      this.scratch = [];
      this.tags = new Uint32Array(this.source.walls.length);
      const count = this.width * this.height;
      for (let i = 0; i < count; i++) {
        this.buckets.push([]);
        this.small.push([]);
      }
      this.indexWalls();
      this.world = Object.create(game);
      const map = Object.create(this.source);
      map.fits = (x, y, r) => this.fits(x, y, r);
      map.cast = (x, y, dx, dy, limit, r = 0) => this.cast(x, y, dx, dy, limit, r);
      this.world.maze = map;
    }

    indexWalls() {
      const walls = this.source.walls;
      for (let i = 0; i < walls.length; i++) {
        const w = walls[i];
        const x0 = clamp(Math.floor(w.x1 - padding), 0, this.width - 1);
        const x1 = clamp(Math.floor(w.x2 + padding), 0, this.width - 1);
        const y0 = clamp(Math.floor(w.y1 - padding), 0, this.height - 1);
        const y1 = clamp(Math.floor(w.y2 + padding), 0, this.height - 1);
        for (let row = y0; row <= y1; row++) {
          for (let col = x0; col <= x1; col++) {
            const cell = row * this.width + col;
            this.buckets[cell].push(i);
            this.small[cell].push(w);
          }
        }
      }
    }

    fits(x, y, r) {
      const col = Math.floor(x);
      const row = Math.floor(y);
      if (r > padding || row < 0 || col < 0 || row >= this.height || col >= this.width) {
        return this.source.fits(x, y, r);
      }
      return this.source.fits(x, y, r, this.small[row * this.width + col]);
    }

    collect(index) {
      for (const wall of this.buckets[index]) {
        if (this.tags[wall] === this.stamp) continue;
        this.tags[wall] = this.stamp;
        this.scratch.push(this.source.walls[wall]);
      }
    }

    cast(x, y, dx, dy, limit, r) {
      const col = Math.floor(x);
      const row = Math.floor(y);
      if (col < 0 || row < 0 || col >= this.width || row >= this.height ||
          r > padding || limit > 9) {
        return this.source.cast(x, y, dx, dy, limit, r);
      }
      const endX = clamp(Math.floor(x + dx * limit), 0, this.width - 1);
      const endY = clamp(Math.floor(y + dy * limit), 0, this.height - 1);
      if (col === endX && row === endY) {
        return this.source.cast(x, y, dx, dy, limit, r, this.small[row * this.width + col]);
      }
      // Very long or diagonal rays often span most of the board. Linear scan
      // is cheaper than building a large temporary candidate set in that case.
      const cells = (1 + Math.abs(col - endX)) * (1 + Math.abs(row - endY));
      if (cells > 15) return this.source.cast(x, y, dx, dy, limit, r);
      this.stamp = (this.stamp + 1) >>> 0;
      if (this.stamp === 0) {
        this.tags.fill(0);
        this.stamp = 1;
      }
      this.scratch.length = 0;
      const x0 = Math.min(col, endX);
      const x1 = Math.max(col, endX);
      const y0 = Math.min(row, endY);
      const y1 = Math.max(row, endY);
      for (let j = y0; j <= y1; j++) {
        for (let i = x0; i <= x1; i++) this.collect(j * this.width + i);

      return this.source.cast(x, y, dx, dy, limit, r, this.scratch);
    }

    const y = point.y - part.y;

    return Math.hypot(x - part.dx * d, y - part.dy * d);

    const step = .08;

    const enemy = tanks[foe.id];
    const projected = { maze: game.maze, tanks };

      x: me.x, y: me.y, dx: Math.cos(shot.a), dy: Math.sin(shot.a),
      age: 0, life: 10, repath: 0, owner: me.id

    let clear = false;
    let selfDanger = Infinity;
    let enemyDanger = Infinity;
    let enemyLock = 0;
    for (let n = 1; n <= Math.ceil((SEEKER_DELAY + 1.52) / step); n++) {
      const time = step * n;
      shell.age = time;
      if (n < 8) advance(game, self, cmd, step);

      enemy.x = position.x;
      enemy.y = position.y;

      const path = flight(game.maze, shell, Math.atan2(shell.dy, shell.dx),
        speed * step, SHOT, 4);
      const end = along(path, speed * step);
      if (!end) break;
      for (const part of path) {
        if (clear || part.bounced) selfDanger = Math.min(selfDanger, pointToRay(self, part));
        enemyDanger = Math.min(enemyDanger, pointToRay(enemy, part));

      if (selfDanger <= BODY + SHOT) break;

      shell.y = end.y;
      shell.dx = path.at(-1).dx;
      shell.dy = path.at(-1).dy;

/* Model a defender who also sees the maze and our shells. Motion history alone
   cannot predict a dodge caused by a shot that was only just fired. */
(function(global) {
  'use strict';
  const { BODY, SHOT, clamp, angleDiff, dist } = TankArena;
  const { H, TURN, SPEED, pose, bearing, advance, flight, along, positionAt } = TankTactics;

  class ShadowDefender {
    constructor() {
      this.nextFit = 0;
      this.observations = [];
      this.evasionSkill = .45;
    }

    updateSkill(enemy, time) {
      while (this.observations.length && this.observations[0].time <= time) {
        const sample = this.observations.shift();
        const intentError = dist(sample.intent, enemy);
        const dodgeError = dist(sample.dodge, enemy);
        if (Math.abs(intentError - dodgeError) < .10) continue;
        const dodged = dodgeError + .08 < intentError;
        this.evasionSkill = .8 * this.evasionSkill + .2 * Number(dodged);
      }
    }

    traceOurShots(game, me, enemy) {
      const relevant = [];
      for (const b of game.bullets) {
        if (b.owner !== me.id && b.owner !== enemy.id) continue;
        if (b.kind === 'seeker') continue;
        if (dist(b, enemy) > 7.5) continue;
        const life = Math.min(1.60, b.life - b.age,
          b.kind === 'frag' ? Math.max(0, 1.1 - b.age) : Infinity);
        if (life <= 0) continue;
        const path = flight(game.maze, b, Math.atan2(b.dy,b.dx), life * b.speed,
          SHOT, 6, b.kind === 'fragment');
        const samples = [];
        for (let j=0; j<=13; j++) samples.push(along(path, j*H*b.speed));
        relevant.push({ samples, own: b.owner === enemy.id && !b.armed });
      }
      return relevant;
    }

    nearMiss(position, before, samples, j) {
      let danger = 0;
      for (const shot of samples) {
        if (shot.own && j<2) continue;
        const a=shot.samples[j], b=shot.samples[j+1];
        if (!a || !b) continue;
        const dx=position.x-before.x-b.x+a.x;
        const dy=position.y-before.y-b.y+a.y;
        const x=before.x-a.x, y=before.y-a.y;
        const f=clamp(-(x*dx+y*dy)/(dx*dx+dy*dy||1),0,1);
        const d=Math.hypot(x+dx*f,y+dy*f);
        if (d>.54) continue;
        const cost=d<BODY+SHOT+.02?28:3*(.54-d)/.30;
        danger=Math.max(danger,cost);

      const actions = [];
      for (const drive of [-1,0,1]) {
        for (const turn of [-1,0,1]) actions.push({drive,turn});
        actions.push({drive,aim:bearing(enemy,me)});

      const evaluated = [];
      for (const action of actions) {
        const p=pose(enemy);
        const line=[pose(p)];
        let peak=0, sum=0, aim=0;
        for (let j=0;j<19;j++) {
          const before=pose(p);
          const cmd=j===0?input:action;
          advance(game,p,cmd,H);
          line.push(pose(p));
          if (j<13) {
            const danger=this.nearMiss(p,before,threats,j)/(1+.24*j);
            peak=Math.max(danger,peak);
            sum+=danger;
            aim+=Math.cos(angleDiff(bearing(p,me),p.a))/(1+.3*j);

        const arrival=dist(p,me);
        const trend=action.drive===Math.sign(input.drive||0)?.36:0;
        const score=-peak- .5*sum + .52*aim + trend - .25*Math.abs(arrival-2.1);
        evaluated.push({score,line,action});
      }
      return evaluated.sort((a,b)=>b.score-a.score);
    }

    addForecasts(game, me, enemy, input, forecasts) {
      this.updateSkill(enemy,game.time);
      if (!forecasts.length || !game.bullets.length || dist(me,enemy)>7.6) return;
      const threats=this.traceOurShots(game,me,enemy);
      if (!threats.length) return;
      let danger=0;
      const intended=forecasts[0].line;
      for (let j=0;j<12;j++) danger=Math.max(danger,this.nearMiss(intended[j+1],intended[j],threats,j));
      if (danger<1.6) return;
      const sorted=this.dodges(game,enemy,me,input,threats);
      const first=sorted[0];

          dodge:positionAt(first.line,.60)

      this.game = game;
      this.me = me;
      this.foe = foe;

      this.enabled = foe.alive && forecasts.length > 0 &&
        (game.count(me.id) < 5 || (me.item && me.item !== 'shield')) &&
        me.item !== 'mine' && me.item !== 'seeker';

      this.laser = me.item === 'laser';

      // move sideways. Rotating away takes time even if input latency is zero.

      const achievable = 2.02 * arrival * lateral;

      const ready = this.foe.item || this.game.count(this.foe.id) < 5;
      if (!ready) return 0;
      const eta = error / TURN + (this.foe.item === 'laser' ? 0 : d / SPEED);
      return Math.max(0, .65 - eta) * (this.me.item === 'shield' ? .4 : 1.8);

      if (!this.enabled || time > 1.13) return 0;
      const key = Math.round(p.x*12) + ',' + Math.round(p.y*12) + ',' +
        Math.round(p.a*16) + ',' + Math.round(time/H);
      if (this.cache.has(key)) return this.cache.get(key);
      const f = this.forecasts[0];
      const now = positionAt(f.line, time);
      const range = dist(now, p);
      let result = 0;
      if (range < 5.8 && this.game.maze.visible(p, now, .026)) {
        let aim = bearing(p, now);

        let hit = 0;

        if (gap<.82 || gap>5) continue;
        if (game.mines.some(m=>m.armed && dist(m,p)<.92 && maze.visible(m,p))) continue;
        const sight=maze.visible(p,foe,SHOT);
        let gateAccess=0;
        for (const e of exits.slice(0,2)) {
          if (maze.visible(p,e.p,SHOT)) {
            const arrival=Math.max(.20,dist(foe,e.p)/2.02);
            const covered=this.traffic?.risk(e.p,arrival,.18,me.id) || 0;
            gateAccess+=Math.min(1,e.support)*(1-.60*covered);
          }
        }
        // With no round ready, wait one corner behind the firing line. The
        // adjacent square must actually open onto an exit or the opponent.
        let peek=null;
        if (staging) {
          if (sight || !maze.links[cell].some(n=>n!==here && atlas.depth[n]===0)) continue;
          for (const id of maze.links[cell]) {
            const opening=atlas.centers[id];
            const canSee=maze.visible(opening,foe,SHOT) || exits.some(e=>
              e.support>.22 && maze.visible(opening,e.p,SHOT));
            if (canSee && !game.mines.some(m=>m.armed && dist(m,opening)<.92)) {
              peek=opening;
              break;
            }
          }
          if (!peek) continue;
        } else if (!sight && gateAccess<.25) continue;
        const offAxis=Math.abs(angleDiff(bearing(foe,p),foe.a));
        if (sight && offAxis<.55 && reload<paths.elapsed[cell]+.2 && me.item!=='shield') continue;
        const cover=maze.links[cell].some(n=>!atlas.cellSight(n,maze.cell(foe)));
        const novelty=clamp((game.time-nav.visits[cell])/8,0,1);
        const rotation=Math.abs(angleDiff(bearing(foe,p),oldAngle));
        const spent=(this.used.get(cell) ?? -100)>game.time-8;
        const eta=paths.elapsed[cell];
        const returnRisk=this.traffic ? this.traffic.risk(p,eta+.85,.38) : 0;
        const score=1.1*gateAccess-returnRisk*1.1+.65*Number(sight)+.83*Math.min(1.9,rotation)+
          .55*offAxis+.85*Number(cover)+novelty-1.6*Number(spent)-
          .38*travel-.48*Math.abs(gap-1.7)-.7*atlas.depth[cell];
        if (!best || best.score<score) best={cell,p,score,peek};
      }
      if (best) {
        const cells=[];
        for (let id=best.cell; id!==here; id=paths.prev[id]) cells.push(id);
        best.route=[here,...cells.reverse()];
      }
      return best;
    }

    safeAdvance(game,me,target,field) {
      // A shell crossing the current parking spot need not cross the approach.
      // Test both legal drive directions with the current turn limit.
      for (const drive of [1,-1]) {
        const p=pose(me);
        let exposed=false;
        for (let i=0;i<6;i++) {
          const before=pose(p);
          const turn=angleDiff(bearing(p,target)+(drive<0?Math.PI:0),p.a);
          advance(game,p,{drive,turn:clamp(turn/(TURN*H),-1,1)},H);
          const risk=field.cost(before,p,i);
          if (risk.danger>1.8 || risk.gun>1.15) { exposed=true; break; }
        }
        if (!exposed && dist(p,target)<dist(me,target)-.45) return true;
      }
      return false;
    }

    peekGoal(game,me,foe,nav,forecasts,field,visible,reload) {
      const maze=game.maze;
      const dangerous=(p)=>game.mines.some(m=>m.armed && dist(m,p)<.92 && maze.visible(m,p));
      if (this.peek) {
        const order=this.peek;
        const angle=Math.abs(angleDiff(bearing(foe,order.out),foe.a));
        const counter=(maze.visible(foe,order.out,SHOT) && angle<.55 && reload<.30) ||
          (foe.item && foe.item!=='mine');
        const spent=this.tap!==order.tap;
        if (game.time>order.until || counter || spent) order.returning=true;
        if (order.returning) {
          if (game.time<order.until+1 && dist(me,order.cover)>.18 &&
              !maze.visible(foe,order.cover,SHOT) && !dangerous(order.cover) &&
              TankTactics.walkable(maze,me,order.cover)) {
            return {type:'withdraw',p:order.cover,target:order.cover,watch:foe};
          }
          this.peek=null;
          return null;
        }
        if (!dangerous(order.out) && TankTactics.walkable(maze,me,order.out)) {
          return {type:'peek',p:order.out,target:order.out,watch:foe};
        }
        this.peek=null;
      }
      if (visible || game.time<this.nextPeek || game.time-this.lastDamage<28 ||
          game.count(me.id)>3 || foe.item && foe.item!=='mine') return null;
      this.nextPeek=game.time+.38;
      const atlas=nav.atlas, cell=maze.cell(me);
      const target=positionAt(forecasts[0].line,.50);
      let best=null;
      for (const n of atlas.options(cell,2)) {
        const center=atlas.centers[n];
        for (const fraction of [.55,1]) {
          const out={x:me.x+(center.x-me.x)*fraction,y:me.y+(center.y-me.y)*fraction};
          const travel=dist(me,out), range=dist(out,target);
          if (travel<.24 || travel>1.45 || range<.70 || range>4.25 ||
              !maze.visible(out,target,SHOT) || !TankTactics.walkable(maze,me,out) || dangerous(out)) continue;
          const turn=Math.abs(angleDiff(bearing(out,target),me.a))/TURN;
          const enemyTurn=Math.abs(angleDiff(bearing(foe,out),foe.a))/TURN;
          const lead=Math.max(reload,enemyTurn)-turn;
          if (lead < (me.item==='shield' ? .10 : .30)+travel*.13) continue;
          const p=pose(me);
          const reverse=Math.abs(angleDiff(bearing(p,out),p.a))>Math.PI/2;
          let unsafe=false;
          for (let i=0;i<8 && dist(p,out)>.13;i++) {
            const before=pose(p);
            const delta=angleDiff(bearing(p,out)+(reverse?Math.PI:0),p.a);
            advance(game,p,{drive:reverse?-1:1,turn:clamp(delta/(TURN*H),-1,1)},H);
            const risk=field.cost(before,p,i);
            if (risk.danger>2 || risk.gun>1) { unsafe=true; break; }
          }
          if (unsafe || dist(p,out)>.20) continue;
          const score=Math.min(1.4,lead)-travel*.43-range*.22;
          if (!best || score>best.score) best={out,travel,score};
        }
      }
      if (!best) return null;
      this.peek={out:best.out,cover:pose(me),tap:this.tap,
        until:game.time+.45+best.travel/2.02,returning:false};
      this.nextPeek=this.peek.until+1.1;
      return {type:'peek',p:best.out,target:best.out,watch:target};
    }

    waitForCrossing(game,me,foe,forecasts,field) {
      if (this.ambush) {
        const a=this.ambush;
        if (a.until>game.time && a.tap===this.tap && dist(me,a.p)<.32 &&
            !field.incoming() && !game.maze.visible(me,foe,SHOT)) return a;
        this.ambush=null;
      }
      if (game.time<this.nextAmbush || field.incoming()) return null;
      this.nextAmbush=game.time+.36;
      const gates=new Map(), maze=game.maze;
      for(const f of forecasts) {
        // The opponent must actually step into a shootable lane while we
        // can turn in cover. Merely predicting an adjacent room is insufficient.
        for (let j=2;j<Math.min(11,f.line.length);j++) {
          const p=f.line[j],arrival=j*H;
          if (!maze.visible(me,p,SHOT)) continue;
          const range=dist(me,p),turn=Math.abs(angleDiff(bearing(me,p),me.a))/TURN;
          if (range<.75 || range>3.6 || turn+range/SPEED>arrival+.15 ||
              (this.traffic?.risk(p,arrival,.13,me.id)||0)>.64) continue;
          const key=maze.cell(p), before=gates.get(key);
          if(before) before.weight+=f.weight;
          else gates.set(key,{p,arrival,weight:f.weight});
          break;
        }
      }
      let gate;
      for(const g of gates.values()) if(g.weight>.30 && (!gate || g.weight>gate.weight)) gate=g;
      if (!gate || (this.traffic?.risk(me,gate.arrival*.5,.25)||0)>.45 ||
          (this.traffic?.risk(me,gate.arrival,.25)||0)>.45) return null;
      this.nextAmbush=game.time+2.3;
      this.ambush={type:'intercept',p:pose(me),target:gate.p,watch:gate.p,tap:this.tap,
        until:game.time+Math.min(.78,gate.arrival)};
      return this.ambush;
    }

    goal(game, me, foe, normal, nav, shot, forecasts, field) {
      if (!this.active || !foe.alive || !forecasts.length) { this.peek=null; return normal; }
      const ammo=5-game.count(me.id), armed=me.item && me.item!=='shield';
      const hazard=foe.item==='laser' || foe.rapid || field.missiles.seeds.length ||
        game.mines.some(m=>m.armed && dist(me,m)<1.05);
      if (hazard || normal.type==='pickup' ||
          (!this.peek && shot?.kill>.70 && shot.impact<.58)) {
        this.order=null;
        this.peek=null;
        return normal;
      }
      const maze=game.maze, there=maze.cell(foe);
      const gap=dist(me,foe), visible=maze.visible(me,foe,SHOT);
      const exposed=Math.abs(angleDiff(bearing(foe,me),foe.a));
      const reload=this.reload(game,foe);
      if (this.cyclingAmmo && !visible && ammo>=1 && !armed && !this.peek) {
        const ambush=this.waitForCrossing(game,me,foe,forecasts,field);
        if (ambush) { this.order=null; return ambush; }
      }
      if (me.item!=='mine' && !foe.rapid && (this.peek || ammo>=2)) {
        const peek=this.peekGoal(game,me,foe,nav,forecasts,field,visible,reload);
        if (peek) { this.order=null; return peek; }
      }
      const ourTurn=Math.abs(angleDiff(bearing(me,foe),me.a))/TURN;
      const theirTurn=exposed/TURN;
      const headStart=Math.max(reload,theirTurn) - ourTurn;
      const pressureTime=Math.max(0,gap-1.0)/2.02;
      const advantage=headStart > .16+pressureTime*.48 ||
        (me.item==='shield' && headStart>.03 && gap<2.9);
      const p=positionAt(forecasts[0].line,.34);
      const coveredGate=this.traffic && visible && gap<3.5 && ammo>=2 &&
        forecasts.slice(0,3).some(f=>{
          const j=f.line.slice(0,13).findIndex(s=>maze.cell(s)!==there);
          return j>1 && f.weight>.15 && this.traffic.risk(f.line[j],j*H,.13,me.id)>.66;
        });
      const escapeClear=coveredGate && maze.links[maze.cell(me)].some(id=>{
        const cover=maze.center(id), eta=dist(me,cover)/2.02;
        return !maze.visible(foe,cover,SHOT) && TankTactics.walkable(maze,me,cover) &&
          !game.mines.some(m=>m.armed && dist(m,cover)<.90 && maze.visible(m,cover)) &&
          this.traffic.risk(cover,eta,.22)<.28;
      });
      const forcedTurn=game.time-this.lastDamage>24 && gap<3.25 && exposed>1.02 &&
        ourTurn<.34 && forecasts.some(f=>f.weight>.20 && f.coverage>.68);
      if (visible && gap<4 && gap>.85 && (ammo>=2 || me.item==='triple') && !foe.item &&
          (advantage || forcedTurn || (coveredGate && escapeClear && exposed>1.1)) && (!field.incoming() || this.safeAdvance(game,me,p,field))) {
        const route=routeInfo(maze,me,p,game.mines.filter(m=>m.armed));
        this.order=null;
        return {type:'close',p:route.next,target:p, watch:p};
      }
      if (gap<1.55 && visible) return normal;
      const slotSoon=this.traffic?.release(me.id,.78)<1.7 || game.bullets.some(b=>b.owner===me.id && b.kind==='regular' && b.life-b.age<1.7);
      const staging=!armed && ammo<=1 && !visible && (slotSoon || (this.cyclingAmmo && (ammo>0 || this.traffic?.release(me.id,.78)<3)));
      if (!armed && !ammo && !staging) return normal;
      if (staging && field.incoming()) { this.order=null; return normal; }
      if (this.order && (game.time>this.order.until || staging!==this.order.staging ||
          (!staging && dist(me,this.order.p)<.28) ||
          nav.atlas.range(this.order.foeCell,there)>2)) this.order=null;
      if (!this.order && game.time>=this.nextOrder) {
        this.nextOrder=game.time+.65;
        const best=this.choosePost(game,me,foe,nav,reload,this.exits(game,foe,forecasts),staging);
        if (best && best.score>1.0) {
          const eta=nav.atlas.eta(me,best.p);
          this.order={...best,staging,foeCell:there,until:game.time+clamp(eta+.55,.85,3.2)};
          this.used.set(best.cell,game.time);
        }
      }
      if (!this.order) return normal;
      const index=this.order.route.indexOf(maze.cell(me));
      if (index<0) { this.order=null; return normal; }
      const centers=nav.atlas.centers;
      const nextCell=this.order.route[index+1] ?? this.order.cell;
      const next=TankTactics.walkable(maze,me,centers[nextCell]) ? centers[nextCell] : centers[this.order.route[index]];
      const eta=dist(me,next)/2.02;
      const inSight=maze.visible(foe,next,SHOT);
      const canAim=Math.abs(angleDiff(bearing(foe,next),foe.a))/TURN < Math.min(.32,eta+.04);
      if ((inSight && canAim && reload<eta+.16 && me.item!=='shield') ||
          game.mines.some(m=>m.armed && dist(m,next)<.85 && maze.visible(m,next))) {
        this.order=null;
        return normal;
      }
      const look=positionAt(forecasts[0].line,.48);
      const watch=this.order.peek || (maze.visible(this.order.p,look,SHOT) && dist(me,this.order.p)<1.9 ? look : null);
      return {type:staging?'stage':'rotate',p:next,target:this.order.p,watch};
    }

    seal(game,me,foe,forecasts,gun,direct) {
      if (!this.active || !foe.alive || !forecasts.length || (me.item && me.item!=='shield') ||
          game.count(me.id)>3 || direct?.kill>.80 || direct?.followup || game.time<this.nextSeal) return direct;
      this.nextSeal=game.time+.19;
      const maze=game.maze, originCell=maze.cell(foe);
      const ownShells=game.bullets.filter(b=>b.owner===me.id &&
        ['regular','triple','rapid','fragment'].includes(b.kind)).map(b=>{
        const life=Math.min(1.55,b.life-b.age);
        const path=TankTactics.flight(maze,b,Math.atan2(b.dy,b.dx),life*b.speed,SHOT,6,b.kind==='fragment');
        return {path,life,speed:b.speed};
      });
      let best=direct;
      for (const exit of this.exits(game,foe,forecasts).slice(0,2)) {
        if (exit.support<.22 || dist(me,exit.p)>5.6) continue;
        const uncovered=[];
        for (const f of forecasts) {
          const j=f.line.findIndex(p=>maze.cell(p)!==originCell);
          if (j<1 || j>12 || maze.cell(f.line[j])!==exit.id) continue;
          const covered=ownShells.some(s=>Number.isFinite(crossing(f.line,s.path,s.speed,s.life,0).contact));
          if (!covered) uncovered.push({f,j});
        }
        const mass=uncovered.reduce((v,r)=>v+r.f.weight,0);
        if (mass<.14) continue;
        const lead=uncovered[0];
        if ((this.traffic?.risk(lead.f.line[lead.j],lead.j*H,.09,me.id)||0)>.76) continue;
        const target=lead.f.line[lead.j];
        const proposed=[bearing(me,target),me.a];
        for (const s of (gun.finalists || [])) {
          if (s.banks && s.kill>.18 && s.selfTime>.55) proposed.push(s.a);
          if (proposed.length>=7) break;
        }
        for (const a of new Set(proposed)) {
          const delay=Math.abs(angleDiff(a,me.a))/TURN;
          if (delay>.43) continue;
          const shot=gun.lane(game,me,forecasts,a,null);
          let gateHits=0, first=Infinity;
          for (const {f,j} of uncovered) {
            const hit=crossing(f.line,shot.path,SPEED,1.48,delay).contact;
            if (!Number.isFinite(hit) || hit+.20>=shot.selfTime || Math.abs(hit+delay-j*H)>.40) continue;
            gateHits+=f.weight;
            first=Math.min(first,hit);
          }
          if (gateHits<.13 || shot.value<.22) continue;
          const value=shot.value+.43*gateHits+Math.min(.13,exit.support*.14);
          const rank=value-delay*.36;
          if (!best || rank>best.rank+.025) {
            best={...shot,impact:first,a,weapon:null,value,rank,viable:true,seal:true};
          }
        }
      }
      if (best?.seal) this.nextSeal=game.time+.045;
      return best;
    }

    conserve(game,me,foe,shot) {
      if (!this.active || me.item && me.item!=='shield') return false;
      const used=game.count(me.id);
      if (used<3 || dist(me,foe)<1.35 || (shot.kill>.75 && shot.impact<.8)) return false;
      // Firing on exactly the same long lane as a shell still leaving the
      // muzzle rarely buys a second exit. Spend the slot when the line changes.
      if (used>=3 && shot.impact>.70 && !shot.seal && !shot.followup && foe.item!=='shield' &&
          game.bullets.some(b=>b.owner===me.id && b.kind==='regular' && b.age<.46 &&
            Math.abs(angleDiff(Math.atan2(b.dy,b.dx),shot.a))<.085 && dist(b,me)<1.65)) return true;
      const soon=this.traffic?.release(me.id,.78)<.7 || game.bullets.some(b=>b.owner===me.id && b.kind==='regular' && b.life-b.age<.70);
      if (shot.audit?.trapped && shot.impact<1.10) return false;
      const blind=!game.maze.visible(me,foe,SHOT);
      if (this.cyclingAmmo && blind && !shot.seal && !shot.followup &&
          !(shot.kill>.78 && shot.impact<1.25)) {
        // One expiring shell is not a replenished magazine. A second
        // recovery buys room to keep firing when the opponent reaches the exit.
        const recovering=game.bullets.filter(b=>b.owner===me.id && b.kind==='regular' &&
          !b.gone && b.life-b.age<1.45).length;
        if (used===4 && recovering<2 || used===3 && !recovering && shot.kill<.64) return true;
      }
      if (soon) return false;
      return used===4 ? (shot.kill<.82 || shot.impact>1.10) :
        blind && (shot.kill<.56 || shot.impact>1.25);
    }
  }
  global.TankDuelPlanner=DuelPlanner;
})(globalThis);

</script>
<script>
/* Static walls make the no-impact path of a regular round reusable for its
   entire lifetime. Passage times are absolute arena seconds. Observed hits
   delete a track; possible future hits only reduce its confidence. */
(function(global) {
  'use strict';
  const { BODY, SHOT, STEP, clamp, dist } = TankArena;
  const { H, positionAt } = TankTactics;
  const clearance = BODY + SHOT + .08;

  // Intersect a directed leg with one cell expanded by the vehicle radius.
  function axisRange(p,d,lo,hi) {
    if (Math.abs(d)<1e-12) return p>=lo && p<=hi ? [-Infinity,Infinity] : null;
    const a=(lo-p)/d, b=(hi-p)/d;
    return d>0 ? [a,b] : [b,a];
  }

  class ShellTraffic {
    constructor(maze) {
      this.maze=maze;
      this.tracks=new Map();
      this.cells=maze.links.map(()=>[]);
      this.now=0;
      this.nextEstimate=0;
    }

    index(track,leg) {
      const m=this.maze;
      const x1=leg.x+leg.dx*leg.length, y1=leg.y+leg.dy*leg.length;
      const left=clamp(Math.floor(Math.min(leg.x,x1)-clearance),0,m.cols-1);
      const right=clamp(Math.floor(Math.max(leg.x,x1)+clearance),0,m.cols-1);
      const top=clamp(Math.floor(Math.min(leg.y,y1)-clearance),0,m.rows-1);
      const bottom=clamp(Math.floor(Math.max(leg.y,y1)+clearance),0,m.rows-1);
      for(let x=left;x<=right;x++) {
        const u=axisRange(leg.x,leg.dx,x-clearance,x+1+clearance);
        if (!u) continue;
        for(let y=top;y<=bottom;y++) {
          const v=axisRange(leg.y,leg.dy,y-clearance,y+1+clearance);
          if (!v) continue;
          const lo=Math.max(0,u[0],v[0]), hi=Math.min(leg.length,u[1],v[1]);
          if (hi<lo) continue;
          const cell=y*m.cols+x;
          this.cells[cell].push({track,leg,enter:leg.at+lo/track.speed,leave:leg.at+hi/track.speed});
          track.touched.add(cell);
        }
      }
    }

    extend(t) {
      const remaining=(t.motionUntil-t.end)*t.speed;
      const wall=this.maze.cast(t.x,t.y,t.dx,t.dy,remaining,SHOT);
      const length=wall ? wall.d : remaining;
      const leg={at:t.end,x:t.x,y:t.y,dx:t.dx,dy:t.dy,length};
      this.index(t,leg);
      t.end=wall ? t.end+length/t.speed : t.motionUntil;
      if (wall) {
        t.selfFrom=Math.min(t.selfFrom,t.end);
        t.x+=t.dx*length+wall.nx*.00001;
        t.y+=t.dy*length+wall.ny*.00001;
        if(wall.nx) t.dx=-t.dx;
        if(wall.ny) t.dy=-t.dy;
      }
    }

    update(game,me,foe,forecasts,previousPlan,planAge=0) {
      this.now=game.time;
      this.plannerId=me.id;
      const current=new Set(game.bullets.filter(b=>!b.gone && b.kind==='regular'));
      for(const [bullet,track] of this.tracks) if(!current.has(bullet)) {
        for(const cell of track.touched) this.cells[cell]=this.cells[cell].filter(v=>v.track!==track);
        this.tracks.delete(bullet);
      }
      const fresh=this.tracks.size===0 && current.size>0;
      for(const b of current) if(!this.tracks.has(b)) {
        this.tracks.set(b,{owner:b.owner,speed:b.speed,x:b.x,y:b.y,dx:b.dx,dy:b.dy,
          until:game.time+b.life-b.age,
          motionUntil:game.time+Math.max(0,Math.ceil((b.life-b.age)/STEP)-1)*STEP,
          end:game.time,arrivals:[[],[]],touched:new Set(),
          selfFrom:b.armed ? game.time : game.time+STEP+Math.max(0,BODY+SHOT+.002-dist(b,game.tanks[b.owner]))/(b.speed-2.02)});
      }
      // Extend the shortest known prefix first. One operation costs one wall
      // cast. Queued tails resume next decision even in narrow corridors.
      const budget=game.bullets.length>18 ? 12 : 28;
      for(let i=0;i<budget;i++) {
        let next;
        for(const t of this.tracks.values()) if(t.motionUntil-t.end>1e-7 && (!next || t.end<next.end)) next=t;
        if(!next) break;
        this.extend(next);
      }
      if(fresh || this.now>=this.nextEstimate) {
        this.nextEstimate=this.now+(game.bullets.length>18 ? .36 : .24);
        this.estimateHits(me,foe,forecasts,previousPlan,planAge);
      }
    }

    estimateHits(me,foe,forecasts,plan,planAge) {
      for(const t of this.tracks.values()) t.arrivals=[[],[]];
      if(!this.tracks.size) return;
      const paths=[];
      if (me.alive && plan?.length) {
        const line=[me];
        // The first saved pose was one search step after the last decision.

    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)pause();});
  window.addEventListener('blur',()=>{if(running)pause();});
  window.addEventListener('pagehide',save);
  document.querySelectorAll('.portrait').forEach((c,i)=>TankArt.drawPortrait(c,i));
  for(const i of [0,1])for(let j=0;j<5;j++)$('ammo'+i).append(document.createElement('i'));

  release.connect({
    inRound:()=>active && !game.result,
    save,
    openNotes() {
      if (running) pause();
      const notes=panelBody.querySelector('.release-notes');
      if (notes) { notes.open=true; notes.scrollIntoView({block:'nearest'}); }
    },
    prompt(latest) {
      view='update';
      section('本局已结束 · 有新版本','v'+latest.version+' · '+latest.title+'。比分已保存在这台设备。');
      panelBody.querySelectorAll('.release-notes,.release-update').forEach(el=>el.remove());
      const notes=document.createElement('ul');
      notes.className='release-changes';
      for (const text of latest.notes) {
        const li=document.createElement('li');li.textContent=text;notes.append(li);
      }
      const refresh=action('刷新更新',()=>void release.refresh(),'action primary release-refresh');
      const keep=action('继续当前版本',play);
      const actions=group('stack');
      actions.append(refresh,keep);
      actions.before(notes);
      release.sync();
    }
  });
  sync();deviceScreen();requestAnimationFrame(frame);
})();

</script>
</body></html>
