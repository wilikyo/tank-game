<body>
<div class="stage">
<header><div class="brand"><span class="brand-mark" aria-hidden="true"></span><strong>坦克迷阵</strong><span class="wordmark">TANK ARENA</span></div>

<main>
<section class="hud"><div class="round"><i></i>第 <b id="round">01</b> 局</div><div class="mode-tag" id="mode-label">迷宫对决</div></section>

<div class="player right"><canvas class="portrait" width="96" height="90" aria-hidden="true"></canvas><div class="player-text"><strong id="name1">GPT</strong><div class="ammo" id="ammo1"></div><small id="item1"></small></div><b class="score" id="score1">0</b></div>

<script>
/* Shared simulation. World coordinates are measured in maze cells, time in seconds. */
(function (global) {
  'use strict';
  const TAU = Math.PI * 2, WALL = .075, BODY = .181, SHOT = .033, STEP = 1 / 120;
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const angleDiff = (a, b) => Math.atan2(Math.sin(a-b), Math.cos(a-b));
  const dist = (a,b) => Math.hypot(a.x-b.x,a.y-b.y);
  const ITEMS = {
    shield: ['护盾','抵挡一次命中'], rapid: ['连发','按住扫射，松开即结束，最长 3 秒'],
    triple: ['三连发','一次射出三颗扇形弹'], laser: ['激光','瞬发光束，最多反弹六次'],
    seeker: ['追踪弹','出膛后追踪最近的存活坦克，可能折返追自己'], frag: ['破片弹','命中或飞行 1.1 秒时炸成十二片，碎片碰墙即消失'],
    mine: ['地雷','车尾布雷，离开后感应引爆']
  };
  const randomInt = n => Math.floor(Math.random()*n);
  class Maze {
    constructor(cols, rows) {
      this.cols=cols; this.rows=rows;
      this.links=Array.from({length:cols*rows},()=>[]);
      const edges=[];
      for(let i=0;i<this.links.length;i++){
        if(i%cols<cols-1)edges.push([i,i+1]);
        if(Math.floor(i/cols)<rows-1)edges.push([i,i+cols]);
      }
      for(let i=edges.length-1;i>0;i--){const j=randomInt(i+1);[edges[i],edges[j]]=[edges[j],edges[i]];}
      const parent=this.links.map((_,i)=>i);
      function find(i){while(parent[i]!==i){parent[i]=parent[parent[i]];i=parent[i];}return i;}
      this.walls=[];
      const wall=(x1,y1,x2,y2)=>this.walls.push({x1:x1-WALL/2,y1:y1-WALL/2,x2:x2+WALL/2,y2:y2+WALL/2});
      for(const [a,b] of edges){
        const p=find(a),q=find(b);
        if(p!==q || Math.random()<.18){parent[p]=q;this.links[a].push(b);this.links[b].push(a);}
        else {const x=a%cols,y=Math.floor(a/cols); if(b===a+1)wall(x+1,y,x+1,y+1);else wall(x,y+1,x+1,y+1);}
      }
      wall(0,0,cols,0);wall(0,rows,cols,rows);wall(0,0,0,rows);wall(cols,0,cols,rows);
    }
    cell(p){return clamp(Math.floor(p.x),0,this.cols-1)+this.cols*clamp(Math.floor(p.y),0,this.rows-1);}
    center(i){return {x:i%this.cols+.5,y:Math.floor(i/this.cols)+.5};}
    route(start,end){
      const prev=new Int16Array(this.links.length).fill(-1), queue=[start]; prev[start]=start;
      for(let k=0;k<queue.length && prev[end]===-1;k++)
        for(const n of this.links[queue[k]])if(prev[n]===-1){prev[n]=queue[k];queue.push(n);}
      const result=[];for(let i=end;i!==start;i=prev[i])result.push(i);
      return result.reverse();
    }
    /* Intersect the swept point with walls expanded by the object's radius. */
    cast(x,y,dx,dy,limit,r=0,walls=this.walls){
      let best=null, nearest=limit;
      for(const w of walls){
        const l=w.x1-r,h=w.x2+r,t=w.y1-r,b=w.y2+r;
        if(Math.abs(dx)<1e-10 && (x<l || x>h))continue;
        if(Math.abs(dy)<1e-10 && (y<t || y>b))continue;
        const ax=Math.abs(dx)<1e-10?-Infinity:((dx>0?l:h)-x)/dx;
        const bx=Math.abs(dx)<1e-10?Infinity:((dx>0?h:l)-x)/dx;
        const ay=Math.abs(dy)<1e-10?-Infinity:((dy>0?t:b)-y)/dy;
        const by=Math.abs(dy)<1e-10?Infinity:((dy>0?b:t)-y)/dy;
        const enter=Math.max(ax,ay),leave=Math.min(bx,by);
        if(enter<-.000001 || leave<enter || enter>nearest+.000001)continue;
        const nx=ax>=ay-.000001?-Math.sign(dx):0,ny=ay>=ax-.000001?-Math.sign(dy):0;
        if(best && Math.abs(enter-nearest)<.000001){best.nx ||= nx;best.ny ||= ny;}
        else {nearest=Math.max(0,enter);best={d:nearest,nx,ny};}
      }
      return best;
    }
    fits(x,y,r,walls=this.walls){
      for(const w of walls){
        if(x<=w.x1-r || x>=w.x2+r || y<=w.y1-r || y>=w.y2+r)continue;
        const dx=x-clamp(x,w.x1,w.x2),dy=y-clamp(y,w.y1,w.y2);
        if(dx*dx+dy*dy<r*r)return false;
      }
      return true;
    }
    visible(a,b,r=0){
      const d=dist(a,b);return d<.00001 || !this.cast(a.x,a.y,(b.x-a.x)/d,(b.y-a.y)/d,d,r);
    }
  }
  function circleHit(x,y,dx,dy,tank,r){
    const ox=tank.x-x,oy=tank.y-y,along=ox*dx+oy*dy;
    const discr=r*r-(ox*ox+oy*oy-along*along);
    if(discr<0 || along+Math.sqrt(discr)<0)return Infinity;
    return Math.max(0,along-Math.sqrt(discr));
  }
  const idle=()=>({drive:0,turn:0,held:false,press:0});
  class Game {
    constructor(options={}){
      this.options=options;this.score=[0,0];this.round=0;this.newRound();
    }
    newRound(){
      const sizes=[[13,7],[12,7],[11,7],[12,8]];
      const [c,r]=sizes[randomInt(sizes.length)];
      this.maze=new Maze(c,r);this.time=0;this.finishAt=null;this.round++;this.nextDrop=8;
      this.bullets=[];this.laserHits=[];this.items=[];this.mines=[];this.effects=[];this.result=null;
      const flip=randomInt(2);
      this.tanks=[0,1].map(i=>({id:i,x:(i^flip)?c-1.5:1.5,y:1.5+randomInt(r-2),a:(i^flip)?Math.PI:0,
        alive:true,item:null,rapid:null,flash:0,shieldFlash:0}));
      this.ai=this.options.bot && ['medium','hard'].includes(this.options.difficulty)
        ? new global.TankPilot(this.options.difficulty) : new EasyPilot();this.botInput=idle();
    }
    effect(type,x,y,life,extra={}){this.effects.push({type,x,y,life,total:life,...extra});}
    hit(t){
      if(!t.alive)return;
      if(t.item==='shield'){t.item=null;t.shieldFlash=.22;this.effect('shield',t.x,t.y,.3);return;}
      t.alive=false;t.rapid=null;this.effect('blast',t.x,t.y,.65,{color:t.id});
      if(this.finishAt===null)this.finishAt=this.time+2.5;
    }
    move(t,input,dt){
      if(input.aim!==undefined){
        const diff=angleDiff(input.aim,t.a);
        t.a+=clamp(diff,-3.65*dt,3.65*dt);
      }else t.a+=(input.turn||0)*3.65*dt;
      const drive=(input.drive||0)*2.02*dt, x=t.x+Math.cos(t.a)*drive,y=t.y+Math.sin(t.a)*drive;
      if(this.maze.fits(x,t.y,BODY))t.x=x;
      if(this.maze.fits(t.x,y,BODY))t.y=y;
    }
    shoot(t,kind='regular',offset=0){
      const a=t.a+offset;
      this.bullets.push({kind,owner:t.id,x:t.x,y:t.y,dx:Math.cos(a),dy:Math.sin(a),age:0,armed:false,
        speed:kind==='seeker'?2.65:kind==='rapid'?4.65:3.75,life:10,repath:0});
      t.flash=.07;
    }
    count(id){return this.bullets.filter(b=>!b.gone && b.kind==='regular' && b.owner===id).length;}
    fire(t){
      if(!t.alive || t.rapid)return;
      const kind=t.item;
      if(!kind || kind==='shield'){if(this.count(t.id)<5)this.shoot(t);return;}
      if(kind==='rapid'){t.rapid={elapsed:0,next:.22};return;}
      t.item=null;t.flash=.08;
      if(kind==='triple'){for(const a of [-.18,0,.18])this.shoot(t,kind,a);}
      else if(kind==='laser')this.laser(t);
      else if(kind==='mine'){
        const p={x:t.x-Math.cos(t.a)*.26,y:t.y-Math.sin(t.a)*.26};
        const pos=this.maze.fits(p.x,p.y,.07)&&this.maze.visible(t,p)?p:t;
        this.mines.push({x:pos.x,y:pos.y,owner:t.id,armed:false});
      }else this.shoot(t,kind);
    }
    volley(t,held,dt){
      const burst=t.rapid;if(!burst)return;
      if(held){
        burst.elapsed+=dt;
        if(burst.elapsed>=burst.next && burst.elapsed<=3){this.shoot(t,'rapid',(Math.random()-.5)*.12);burst.next+=.095;}
      }
      if(!held || burst.elapsed>=3){t.rapid=null;t.item=null;}
    }
    trace(b,length,maxBounces,onSegment,preview=false){
      let left=length;
      if(dist(b,this.tanks[b.owner])>BODY+SHOT+.001)b.armed=true;
      for(let i=0;i<=maxBounces && left>1e-7;i++){
        const wall=this.maze.cast(b.x,b.y,b.dx,b.dy,left,b.kind==='laser'?0:SHOT);
        let d=wall?wall.d:left, victim=null;
        for(const t of this.tanks){
          if(!t.alive || (t.id===b.owner && !b.armed))continue;
          const h=circleHit(b.x,b.y,b.dx,b.dy,t,BODY+(b.kind==='laser'?0:SHOT));
          if(h<=d){d=h;victim=t;}
        }
        const x=b.x,y=b.y;b.x+=b.dx*d;b.y+=b.dy*d;
        if(onSegment)onSegment(x,y,b.x,b.y);
        if(victim){
          if(!preview){
            if(b.kind==='laser')this.laserHits.push(victim);else this.hit(victim);
            if(b.kind==='frag')this.fragments(b);
          }
          b.gone=true;return;
        }
        if(!wall)return;
        if(b.kind==='fragment'){b.gone=true;return;}
        b.armed=true;
        if(wall.nx)b.dx=-b.dx;if(wall.ny)b.dy=-b.dy;
        b.x+=wall.nx*.00001;b.y+=wall.ny*.00001;left-=d;
      }
    }
    laserPath(t,length,preview=false){
      const b={kind:'laser',x:t.x,y:t.y,dx:Math.cos(t.a),dy:Math.sin(t.a),owner:t.id,armed:false};
      const lines=[];this.trace(b,length,6,(...s)=>lines.push(s),preview);
      return lines;
    }
    laser(t){
      const lines=this.laserPath(t,Math.hypot(this.maze.cols,this.maze.rows)*8);
      this.effect('laser',t.x,t.y,.58,{lines,owner:t.id});
    }
    fragments(b){
      this.effect('spark',b.x,b.y,.28);
      for(let i=0;i<12;i++){
        const a=(i+(Math.random()-.5)*.55)*TAU/12+Math.atan2(b.dy,b.dx);
        this.bullets.push({kind:'fragment',x:b.x,y:b.y,dx:Math.cos(a),dy:Math.sin(a),speed:3.2+Math.random()*1.1,spin:(Math.random()-.5)*18,life:2.8,age:0,owner:b.owner,armed:true});
      }
      b.gone=true;

      const s = path[i];
      const deltaX = shooter.x - s.x;
      const deltaY = shooter.y - s.y;
      const projection = deltaX * s.dx + deltaY * s.dy;
      const d = clamp(projection, 0, s.end - s.start);
      if (Math.hypot(deltaX - d * s.dx, deltaY - d * s.dy) <= reach + .028) {
        earliest = (s.start + d) / speed;
        break;
      }
    }
    return earliest;
  }

  function shotSpeed(item) {
    if (item === 'rapid') return 4.65;
    if (item === 'seeker') return 2.65;
    return SPEED;
  }

  class AimAngles {
    constructor() {
      this.values = [];
      this.keys = new Set();
    }

    add(a) {
      const wrapped = Math.atan2(Math.sin(a), Math.cos(a));
      const key = Math.round(wrapped * 260);
      if (this.keys.has(key)) return;
      this.keys.add(key);
      this.values.push(wrapped);
    }

    intercept(me, forecast, speed, instant) {
      let time = instant ? 0 : dist(me, forecast.line[0]) / speed;
      // Fixed-point interception includes time spent turning the tank.
      // Three iterations are sufficient at arena tank-to-projectile speeds.
      for (let i = 0; i < 3; i++) {
        const p = positionAt(forecast.line, Math.min(2.12, time));
        const turn = Math.abs(angleDiff(bearing(me, p), me.a)) / TURN;
        time = (instant ? 0 : dist(me, p) / speed) + Math.min(.50, turn);
      }
      return positionAt(forecast.line, time);
    }

    faces(maze, me, radius, limit) {
      const surfaces = new Map();
      for (const w of maze.walls) {
        const x = clamp(me.x, w.x1, w.x2);
        const y = clamp(me.y, w.y1, w.y2);
        const distance = Math.hypot(x - me.x, y - me.y);
        if (distance > limit) continue;
        const vertical = w.x2 - w.x1 < w.y2 - w.y1;
        const v = vertical
          ? (me.x < w.x1 ? w.x1 - radius : w.x2 + radius)
          : (me.y < w.y1 ? w.y1 - radius : w.y2 + radius);
        const key = (vertical ? 'x' : 'y') + v;
        const old = surfaces.get(key);
        if (!old || distance < old.distance) surfaces.set(key, { vertical, v, distance });
      }
      return [...surfaces.values()].sort((a, b) => a.distance - b.distance).slice(0, 10);
    }

    mirror(p, face) {
      return face.vertical
        ? { x: 2 * face.v - p.x, y: p.y }
        : { x: p.x, y: 2 * face.v - p.y };
    }

    build(game, me, foe, forecasts, last) {
      const laser = me.item === 'laser';
      const speed = shotSpeed(me.item);
      const m = game.maze;
      const first = this.intercept(me, forecasts[0], speed, laser);
      this.add(me.a);
      if (last) this.add(last.a);
      this.add(bearing(me, foe));
      for (const f of forecasts) {
        this.add(bearing(me, this.intercept(me, f, speed, laser)));
      }
      for (const cell of m.links[m.cell(foe)]) this.add(bearing(me, m.center(cell)));
      const faces = this.faces(m, me, laser ? 0 : SHOT, laser ? 6.5 : 4.5);
      const targets = [first, foe];
      for (const face of faces) {
        for (const p of targets) {
          const image = this.mirror(p, face);
          if (dist(me, image) <= (laser ? 18 : horizon * speed)) this.add(bearing(me, image));
        }
      }
      // Enumerate nearby two-wall image solutions. Verification uses the real
      // wall segments, which reject spurious solutions from infinite mirrors.
      if (laser || !m.visible(me, foe)) {
        for (const f of faces.slice(0, 5)) for (const q of faces.slice(0, 5)) {
          if (q === f) continue;
          const image = this.mirror(this.mirror(first, q), f);
          if (dist(me, image) <= (laser ? 15 : 7.4)) this.add(bearing(me, image));
        }
      }
      return this.values;
    }
  }

  class FireControl {
    constructor() {
      this.last = null;
      this.nextSnap = 0;
      this.nextTap = 0;
      this.burstUntil = 0;
      this.ordnance = new TankOrdnance();
      this.lastTap = null;
    }

    cover(game, me, forecasts) {
      for (const f of forecasts) f.coverage = 0;
      for (const b of game.bullets) {
        if (b.owner !== me.id || !['regular','triple','rapid','fragment'].includes(b.kind)) continue;
        const duration = Math.min(1.45, b.life - b.age);
        if (duration <= 0) continue;
        const path = flight(game.maze, b, Math.atan2(b.dy, b.dx), b.speed * duration,
          SHOT, 6, b.kind === 'fragment');
        for (const f of forecasts) {
          const result = crossing(f.line, path, b.speed, duration, 0);
          const likelihood = clamp((.39 - result.nearest) / .21, 0, 1);
          f.coverage = Math.max(f.coverage, likelihood);
        }
      }
    }

    laser(game, me, foe, a) {
      const from = { ...me, a };
      const length = Math.hypot(game.maze.cols, game.maze.rows) * 8;
      const lines = game.laserPath(from, length, true);
      const end = lines.at(-1);
      if (!end) return { value: -1 };
      const point = { x: end[2], y: end[3] };
      const hit = dist(point, foe) <= BODY + .001;
      const self = dist(point, me) <= BODY + .001;
      return {
        value: hit && !self ? 1.85 : -.20,
        impact: 0,
        banks: lines.length - 1,
        kill: hit && !self ? 1 : 0,
        selfTime: self ? 0 : Infinity
      };
    }

    lane(game, me, forecasts, a, item) {
      const speed = shotSpeed(item);
      const duration = item === 'frag' ? 1.1 : horizon;
      const path = flight(game.maze, me, a, duration * speed, SHOT, 7);
      const firstReturn = returnTime(me, path, speed);
      const delay = Math.min(.52, Math.abs(angleDiff(a, me.a)) / TURN);
      const epicenter = item === 'frag' ? along(path, duration * speed) : null;
      let value = 0, kill = 0, impact = Infinity, banks = 0;
      for (const f of forecasts) {
        const r = crossing(f.line, path, speed, duration, delay);
        let likelihood = clamp((.45 - r.nearest) / .255, 0, 1);
        const alreadyHit = r.contact < firstReturn;
        if (firstReturn < .33 && !alreadyHit) likelihood = 0;
        if (epicenter) {
          const enemyAtFuse = positionAt(f.line, duration + delay);
          const gap = dist(epicenter, enemyAtFuse);
          if (gap < 1.2 && game.maze.visible(epicenter, enemyAtFuse)) {
            likelihood = Math.max(likelihood, .82 * (1 - gap / 1.4));
          }
        }
        const hitTime = Number.isFinite(r.time) ? r.time : duration;
        const pressure = 1 - .17 * Math.min(hitTime, 2);
        const fresh = 1 - .72 * (f.coverage || 0);
        value += f.weight * likelihood * fresh * pressure;
        kill += f.weight * (alreadyHit ? 1 : 0);
        if (likelihood > .65 && hitTime < impact) {
          impact = hitTime;
          banks = r.banks;
        }
      }
      if (firstReturn < .35 && kill < .66) value -= 1;
      else if (firstReturn < 1.25) value -= .18 * (1.25 - firstReturn) * (1 - kill);
      return { value, kill, impact, banks, selfTime: firstReturn, path };
    }

    spread(game, me, forecasts, a) {
      const delay=Math.abs(angleDiff(a,me.a))/TURN;
      const barrels=[-.18,0,.18].map(offset=>{
        const path=flight(game.maze,me,a+offset,SPEED*horizon,SHOT,7);
        return {path,back:returnTime(me,path,SPEED)};
      });
      let value=0,kill=0,impact=Infinity,banks=0;
      for (const f of forecasts) {
        let chance=0,first=Infinity;
        for (const barrel of barrels) {
          const r=crossing(f.line,barrel.path,SPEED,Math.min(horizon,barrel.back),delay);
          chance=Math.max(chance,clamp((.43-r.nearest)/.23,0,1));
          first=Math.min(first,r.contact);
          if (r.contact<impact) { impact=r.contact; banks=r.banks; }
        }
        if (Number.isFinite(first)) kill+=f.weight;
        value+=f.weight*chance*(1-.45*(f.coverage||0))*(1-.14*Math.min(2,first));
      }
      const selfTime=Math.min(...barrels.map(b=>b.back));
      if (selfTime<.30) value-=.9;
      return {value,kill,impact,banks,selfTime,weapon:'triple',a};
    }

    seeker(game, me, foe, forecasts, a) {
      const launch = flight(game.maze, me, a, .8 * 2.65, SHOT, 5);
      const end = along(launch, .8 * 2.65);
      if (!end) return { value: -1 };
      const returnAt = returnTime(me, launch, 2.65);
      const foePosition = positionAt(forecasts[0].line, .8);
      const chase = dist(end, me) - dist(end, foePosition);
      const cell = game.maze.cell(end);
      const hops = game.maze.route(cell, game.maze.cell(foePosition)).length;
      const value = returnAt < .76 ? -1 :
        .38 + clamp(chase * .23, -.67, .50) - Math.max(0, hops - 3) * .045;
      return { value, kill: 0, impact: .8, banks: launch.length - 1, selfTime: returnAt, path: launch };
    }

    aim(game, me, foe, forecasts) {
      if (!foe.alive || !forecasts.length || me.item === 'mine') return null;
      const weapon = me.item === 'shield' ? null : me.item;
      const ammo = 5 - game.count(me.id);
      if ((!weapon && !ammo) || dist(me, foe) > (weapon === 'laser' ? 17 : 10.2)) return null;
      this.cover(game, me, forecasts);
      const angles = new AimAngles();
      const candidates = angles.build(game, me, foe, forecasts, this.last);
      if (weapon === 'laser') {
        // A long reflected beam can reach rooms outside the two-image search.
        // Sweep continuously around the actual heading and verify each ray.
        const phase = (Math.floor(game.time*14) % 3)/3;
        for (let i=-45;i<=45;i++) angles.add(me.a+(i+phase)*Math.PI/45);
      }
      let best = null;
      const tried = [];
      const evaluate = a => {
        let result;
        if (weapon === 'laser') result = this.laser(game, me, foe, a);
        else if (weapon === 'seeker') result = this.seeker(game, me, foe, forecasts, a);
        else result = this.lane(game, me, forecasts, a, weapon);
        const turn = Math.abs(angleDiff(a, me.a));
        const rank = result.value - turn * .16;
        const shot = { ...result, a, rank, weapon, viable: rank > .24 };
        tried.push(shot);
        if (!best || rank > best.rank) best = shot;
      };
      for (const a of candidates) evaluate(a);
      if (weapon === 'triple') {
        const centers=new AimAngles();
        const top=[...tried].sort((x,y)=>y.rank-x.rank).slice(0,5);
        for (const s of top) for (const offset of [-.18,0,.18]) centers.add(s.a+offset);
        tried.length=0;
        best=null;
        for (const a of centers.values) {
          const shot=this.spread(game,me,forecasts,a);
          shot.rank=shot.value-.16*Math.abs(angleDiff(a,me.a));
          shot.viable=shot.rank>.24;
          tried.push(shot);
          if (!best || shot.rank>best.rank) best=shot;
        }
      } else if (weapon !== 'laser' && weapon !== 'seeker' && best.value > .11) {
        const center = best.a;
        const delta = clamp(.13 / Math.max(1, dist(me, foe)), .012, .065);
        evaluate(center - delta);
        evaluate(center + delta);
      }
      this.finalists = tried;
      this.last = best;
      return best;
    }

    canEscape(game, me, launchPose, cmd, shot, opponent) {
      if (shot.weapon === 'laser') return this.laser(game, launchPose, opponent, launchPose.a).kill === 1;
      const speed = shotSpeed(shot.weapon);
      const angles = shot.weapon === 'triple' ? [-.18, 0, .18] : [0];
      for (const angle of angles) {
        const path = flight(game.maze, launchPose, launchPose.a + angle, speed * 1.18, SHOT, 7);
        const p = pose(launchPose);
        let last = { ...p };
        let armed = false;
        for (let i = 1; i <= 14; i++) {
          const time = i * .08;
          const at = along(path, time * speed);
          if (!at) break;
          // Past a likely impact the returning shell usually no longer exists.
          if (shot.weapon !== 'triple' && shot.kill > .92 && time > shot.impact + .10) break;
          const begin = (time - .08) * speed;
          advance(game, p, cmd, .08);
          for (const part of path) {
            const from = Math.max(begin, part.start);
            const to = Math.min(time * speed, part.end);
            if (to <= from) continue;
            const lo = (from - begin) / (.08 * speed);
            const hi = (to - begin) / (.08 * speed);
            const sx = last.x + (p.x - last.x) * lo;
            const sy = last.y + (p.y - last.y) * lo;
            const bx = part.x + part.dx * (from - part.start);
            const by = part.y + part.dy * (from - part.start);
            const dx = (p.x - last.x) * (hi - lo) - part.dx * (to - from);
            const dy = (p.y - last.y) * (hi - lo) - part.dy * (to - from);
            if (part.bounced || Math.hypot(sx-bx,sy-by) > reach + .001) armed = true;
            if (armed && part.bounced && segmentGap(sx-bx,sy-by,dx,dy) < reach + .025) return false;
          }
          last = { ...p };
        }
      }
      return true;
    }

    opportunistic(game, real, enemy, forecasts, weapon) {
      if (weapon === 'mine' || weapon === 'seeker' || !forecasts.length) return null;
      if (game.time < this.nextSnap) return null;
      this.nextSnap = game.time + .034;
      const shot = this.lane(game, real, forecasts, real.a, weapon);
      const close = dist(real, enemy) < 2.7;
      const reserve = 5 - game.count(real.id);
      const intercept = game.time > 12 && shot.kill >= .70 && shot.impact < 1.35;
      const cutoff = intercept ? .36 : close ? .39 : reserve > 2 ? .58 : .77;
      if (shot.value < cutoff || shot.kill < (close ? .36 : .52)) return null;
      // Firing while turning is worthwhile if there is an opening now. Keep
      // the chosen aim for the next shot, since it may cover a different exit.
      return { ...shot, a: real.a, weapon };
    }

    fragmentClear(game, me, foe, cmd, shot) {
      const near = dist(me, foe);
      if (near < .78 && game.maze.visible(me, foe)) return false;
      const at = Math.min(1.1, shot.kill > .38 ? shot.impact : 1.1);
      const path = flight(game.maze, me, me.a, SPEED * at, SHOT, 5);
      const burst = along(path, SPEED * at);
      if (!burst) return true;
      const p = pose(me);
      const steps = Math.max(1, Math.ceil(at / .1));
      for (let i = 0; i < steps; i++) advance(game, p, cmd, at / steps);
      if (!game.maze.visible(p, burst)) return true;
      return dist(p, burst) > .72;
    }

    beamTap(game, me, foe, enemyInput, dt, cmd, shot) {
      // The arena moves BOTH tanks before resolving the beam. Trace copies in
      // that order. Each candidate is a single reachable steering input.
      const enemy = { ...foe };
      game.move(enemy,enemyInput,dt);
      const trial = Object.create(game);
      trial.tanks = game.tanks.slice();
      trial.tanks[foe.id] = enemy;
      const turns = [cmd.turn];
      if (shot?.kill) turns.push(clamp(angleDiff(shot.a,me.a)/(TURN*dt),-1,1));
      turns.push(0,-1,1,-.5,.5);
      for (const turn of new Set(turns)) {
        const real = { ...me };
        game.move(real,{drive:cmd.drive,turn},dt);
        trial.tanks[me.id] = real;
        if (!this.laser(trial,real,enemy,real.a).kill) continue;
        cmd.turn=turn;
        return real;
      }
      return null;
    }

    trigger(game, me, foe, dt, cmd, shot, forecasts, policy, enemyInput = {}) {
      if (!foe.alive) return;
      if (me.rapid) {
        cmd.held = game.time < this.burstUntil && this.ordnance.sweepSafe(game, me, cmd, foe);
        return;
      }
      if (game.time < this.nextTap && (!policy.follow || game.time - (this.lastTap?.at ?? 0) < .083)) return;
      if (me.item === 'mine' && this.ordnance.evaluateMine(game, me, foe, cmd, forecasts)) {
        cmd.press = 1;
        cmd.held = true;
        this.nextTap = game.time + .13;
        return;
      }
      const weapon = me.item === 'shield' ? null : me.item;
      const ammo = 5 - game.count(me.id);
      if (!weapon && !ammo) return;
      if (shot?.followup && game.time < shot.earliest) return;
      if (weapon === 'laser') {
        const real = this.beamTap(game,me,foe,enemyInput,dt,cmd,shot);
        if (real) {
          cmd.press = 1;
          cmd.held = true;
          this.lastTap = { at:game.time, angle:real.a, weapon };
          this.nextTap = game.time + policy.interval;
        }
        return;
      }
      const real = { ...me };
      game.move(real, cmd, dt);
      const gap = dist(me, foe);
      const tolerance = clamp(.18 / Math.max(1, gap), .027, .12);
      if (!shot || shot.weapon !== weapon || Math.abs(angleDiff(real.a, shot.a)) > tolerance) {
        shot = this.opportunistic(game, real, foe, forecasts, weapon);
        if (!shot) return;
      }
      if (weapon === 'frag' && !this.fragmentClear(game, real, foe, cmd, shot)) return;
      let threshold = .31 + Math.max(0, gap - 2) * .025 + (5 - ammo) * .068;
      if (ammo === 1) threshold += .17;
      if (weapon && weapon !== 'laser') threshold = .39;
      if (foe.item === 'shield' && ammo > 2) threshold -= .075;
      if (weapon === 'seeker') threshold = .39;
      if (shot.followup && ammo > 1) threshold = Math.min(threshold, .34);
      // One expendable slot is worth less than an immediate intercept, but
      // keep it when several guesses merely pass near the enemy. Recovering
      // a slot soon makes a speculative fourth shot less expensive.
      if (!weapon && ammo <= 2 && game.time > 12) {
        const expires = game.bullets.reduce((t,b)=>b.owner===me.id && b.kind==='regular'
          ? Math.min(t,b.life-b.age) : t, Infinity);
        if (shot.kill >= .68 && shot.impact < 1.4) threshold = Math.min(threshold,.39);
        else if (expires > 1.3 && shot.kill < .37) threshold += .23;
      }
      if (shot.value < threshold + policy.threshold) return;
      if (weapon === 'seeker' && !this.ordnance.guidedLaunch(game, me, foe, cmd, shot, forecasts[0])) return;
      if (!this.canEscape(game, me, real, cmd, shot, foe)) return;
      cmd.press = 1;
      cmd.held = true;
      if (weapon === 'rapid') this.burstUntil = game.time + (gap < 2.4 ? .95 : 1.45);
      this.nextTap = game.time + policy.interval;
      this.lastTap = { at: game.time, angle: real.a, weapon };
    }
  }

  global.TankShotGeometry = { crossing };
  global.TankFireControl = FireControl;
})(globalThis);

</script>
<script>
/* Time-indexed danger. A route is scored against the time a shell crosses a
   tile, not a permanently blocked tile. Threats from either tank remain in
   this field throughout the 2.5-second settlement. */
(function (global) {
  'use strict';

  const { BODY, SHOT, clamp, dist, angleDiff } = TankArena;
  const { H, hazards, flight, bearing, positionAt } = TankTactics;
  const contact = BODY + SHOT;
  const margin = .53;

  function separation(x, y, dx, dy) {
    const projection = -(x * dx + y * dy);
    const length = dx * dx + dy * dy;
    const f = length ? clamp(projection / length, 0, 1) : 0;
    return Math.hypot(x + dx * f, y + dy * f);
  }

  class ThreatField {
    constructor(game, tank, opponent, input, forecasts, steps) {
      this.game = game;
      this.tank = tank;
      this.foe = opponent;
      this.steps = steps;
      this.mines = game.mines;
      this.foeForecast = forecasts[0]?.line;
      this.laser = opponent.alive && opponent.item === 'laser';
      this.ready = opponent.alive && (game.count(opponent.id) < 5 ||
        (opponent.item && opponent.item !== 'shield'));
      this.playerFiring = Boolean(input.press || input.edges?.includes(true));
      this.parts = hazards(game, tank, opponent, input, steps, false, true);
      this.missiles = new TankMissileEvasion(game, tank, opponent, this.foeForecast);
      this.bounds = [];
      this.addMuzzleForecast(input);
      this.index();
    }

    addTimedPath(path, speed, delay, confidence) {
      for (const s of path) {
        const from = s.start / speed + delay;
        const to = s.end / speed + delay;
        const low = Math.max(0, Math.floor(from / H));
        const high = Math.min(this.steps, Math.ceil(to / H));
        for (let j = low; j < high; j++) {
          const a = Math.max(j * H, from);
          const b = Math.min((j + 1) * H, to);
          if (b <= a) continue;
          const d0 = (a - delay) * speed - s.start;
          const d1 = (b - delay) * speed - s.start;
          this.parts[j].push({
            p: { x: s.x + s.dx * d0, y: s.y + s.dy * d0 },
            q: { x: s.x + s.dx * d1, y: s.y + s.dy * d1 },
            lo: a / H - j,
            hi: b / H - j,
            confidence
          });
        }
      }
    }

    addMuzzleForecast(input) {
      if (!this.ready || this.laser || this.foe.item === 'mine') return;
      const distance = dist(this.foe, this.tank);
      if (distance > 6) return;
      const rapid = this.foe.rapid;
      const delays = rapid ? [.04,.18,.36] : [this.playerFiring ? 0 : .14];
      const offsets = this.foe.item === 'triple' ? [-.18, 0, .18] : [0];
      const speed = rapid ? 4.65 : 3.75;
      for (const delay of delays) {
        const start = this.foeForecast ? positionAt(this.foeForecast, delay) : this.foe;
        const a = this.foe.a + (input.turn || 0) * 3.65 * delay;
        for (const offset of offsets) {
          const path = flight(this.game.maze, start, a + offset, speed * 1.24, SHOT, 4);
          this.addTimedPath(path, speed, delay, rapid || this.playerFiring ? .88 : .38);
        }
      }
    }

    index() {
      for (let j = 0; j < this.steps; j++) {
        const parts = this.parts[j];
        let left = Infinity, right = -Infinity, top = Infinity, bottom = -Infinity;
        for (const b of parts) {
          b.left = Math.min(b.p.x, b.q.x) - margin;
          b.right = Math.max(b.p.x, b.q.x) + margin;
          b.top = Math.min(b.p.y, b.q.y) - margin;
          b.bottom = Math.max(b.p.y, b.q.y) + margin;
          left = Math.min(left, b.left);
          right = Math.max(right, b.right);
          top = Math.min(top, b.top);
          bottom = Math.max(bottom, b.bottom);
        }
        this.bounds.push({ left, right, top, bottom });
      }
    }

    crossings(p, q, j) {
      const dx = q.x - p.x, dy = q.y - p.y;
      const left = Math.min(p.x, q.x), right = Math.max(p.x, q.x);
      const top = Math.min(p.y, q.y), bottom = Math.max(p.y, q.y);
      const bounds = this.bounds[j];
      if (left > bounds.right || right < bounds.left ||
          top > bounds.bottom || bottom < bounds.top) return 0;
      let worst = 0;
      for (const b of this.parts[j]) {
        if (left > b.right || right < b.left || top > b.bottom || bottom < b.top) continue;
        const x = p.x + dx * b.lo - b.p.x;
        const y = p.y + dy * b.lo - b.p.y;

        const x1 = clamp(Math.floor(w.x2 + padding), 0, this.width - 1);
        const y0 = clamp(Math.floor(w.y1 - padding), 0, this.height - 1);

/* Model a defender who also sees the maze and our shells. Motion history alone

        const sample = this.observations.shift();
        const intentError = dist(sample.intent, enemy);
        const dodgeError = dist(sample.dodge, enemy);
        if (Math.abs(intentError - dodgeError) < .10) continue;
        const dodged = dodgeError + .08 < intentError;
        this.evasionSkill = .8 * this.evasionSkill + .2 * Number(dodged);

    traceOurShots(game, me, enemy) {
      const relevant = [];
      for (const b of game.bullets) {
        if (b.owner !== me.id && b.owner !== enemy.id) continue;
        if (b.kind === 'seeker') continue;
        if (dist(b, enemy) > 7.5) continue;
        const life = Math.min(1.60, b.life - b.age,
          b.kind === 'frag' ? Math.max(0, 1.1 - b.age) : Infinity);
        if (life <= 0) continue;
        const path = flight(game.maze, b, Math.atan2(b.dy,b.dx), life * b.speed,
          SHOT, 6, b.kind === 'fragment');
        const samples = [];
        for (let j=0; j<=13; j++) samples.push(along(path, j*H*b.speed));
        relevant.push({ samples, own: b.owner === enemy.id && !b.armed });
      }

    }

      let danger = 0;
      for (const shot of samples) {
        if (shot.own && j<2) continue;
        const a=shot.samples[j], b=shot.samples[j+1];
        if (!a || !b) continue;
        const dx=position.x-before.x-b.x+a.x;
        const dy=position.y-before.y-b.y+a.y;
        const x=before.x-a.x, y=before.y-a.y;

      const s=unit*ratio;this.c.setTransform(s,0,0,s,margin*s,margin*s);return unit;
    }
    draw(g,names){
      const c=this.c,m=g.maze,unit=this.size(m);if(!unit)return;
      c.fillStyle='#eeede8';c.fillRect(-.2,-.2,m.cols+.4,m.rows+.4);
      c.fillStyle='#f2f1eb';c.fillRect(0,0,m.cols,m.rows);
      c.fillStyle='#303341';for(const w of m.walls)c.fillRect(w.x1,w.y1,w.x2-w.x1,w.y2-w.y1);
      for(const p of g.items)icon(c,p.x,p.y,p.kind);
      for(const p of g.mines){c.lineWidth=.017;circle(c,p.x,p.y,.092,'#4b4d55',ink);circle(c,p.x,p.y,.031,p.armed?'#ff365d':'#eac970');}
      for(const e of g.effects){
        if(e.type!=='smoke')continue;
        const f=1-e.life/e.total,x=e.x+e.jitter*f,y=e.y-.06*f;
        c.save();c.globalAlpha=(1-f)*.48;
        const radius=(e.small?.018:.032)+f*(e.small?.038:.088);
        circle(c,x,y,radius,'#60626a');
        if(e.target!=null)circle(c,x,y,radius*.76,colors[e.target]);
        c.restore();
      }
      for(const t of g.tanks)if(t.alive&&t.item==='laser'){
        beam(c,g.laserPath(t,3.6,true),colors[t.id],true);
      }
      for(const b of g.bullets){
        if(b.kind==='seeker'){missile(c,b.x,b.y,Math.atan2(b.dy,b.dx),1,colors[b.targetId]||'#b2b4b7');continue;}
        if(b.kind==='fragment'){
          c.save();c.translate(b.x,b.y);c.rotate(Math.atan2(b.dy,b.dx)+b.age*b.spin);
          c.beginPath();c.moveTo(.062,0);c.lineTo(-.038,-.023);c.lineTo(-.017,.026);
          c.closePath();c.fillStyle='#393b41';c.fill();c.restore();continue;
        }
        const tint={seeker:'#f0892b',fragment:'#218c83',frag:'#218c83',rapid:'#50433b',triple:'#198058'};
        circle(c,b.x,b.y,b.kind==='fragment'?.025:b.kind==='frag'?.062:.035,tint[b.kind]||ink);
      }
      for(const t of g.tanks){
        if(!t.alive)continue;
        if(t.item==='shield'){c.lineWidth=.022;circle(c,t.x,t.y,.255,'#42c8f224','#159ac9');}
        tank(c,t.x,t.y,1,t.a,t.id,t.flash>0);
        c.save();const font=Math.max(.14,Math.min(.27,12/unit));c.font='bold '+font+'px "Segoe UI","Microsoft YaHei",sans-serif';
        c.textAlign='center';c.textBaseline='bottom';c.lineJoin='round';c.lineWidth=.054;c.strokeStyle='#f2f1eb';c.fillStyle=ink;
        const y=t.y>.59?t.y-.24:t.y+.45;
        const half=c.measureText(names[t.id]).width/2+.03;const x=Math.max(half,Math.min(m.cols-half,t.x));
        c.strokeText(names[t.id],x,y);c.fillText(names[t.id],x,y);c.restore();
      }
      for(const e of g.effects){
        if(e.type==='smoke')continue;
        c.save();const f=1-e.life/e.total;c.globalAlpha=Math.min(1,(1-f)*1.8);
        if(e.type==='laser')beam(c,e.lines,colors[e.owner],false);
        else if(e.type==='blast'||e.type==='spark'){
          c.lineWidth=.022;circle(c,e.x,e.y,.12+f*.42,null,'#c55d2a');
          for(let k=0;k<12;k++){const a=k*2.39996,r=(.16+f*.47)*(.65+(k%4)*.12);
            circle(c,e.x+Math.cos(a)*r,e.y+Math.sin(a)*r,.047*(1-f*.6),k%2?'#dd742f':'#464957');}
        }else{c.lineWidth=.02;circle(c,e.x,e.y,.2+.22*f,null,e.type==='shield'?'#199ec6':'#ca8f2e');}
        c.restore();
      }
    }
  }
  function drawPortrait(canvas,id){
    const c=canvas.getContext('2d');c.clearRect(0,0,canvas.width,canvas.height);
    tank(c,canvas.width/2,canvas.height/2,canvas.height*2,-Math.PI/2,id);
  }
  global.TankArt={Renderer,drawPortrait,tank,swatches,colors};
})(globalThis);

</script>
<script>
(()=>{
  'use strict';
  const {Game,STEP,ITEMS,idle,angleDiff,clamp}=TankArena;
  const $=id=>document.getElementById(id),panel=$('panel'),panelBody=$('panel-body');
  const renderer=new TankArt.Renderer($('board'),$('field'));
  let device='',mode='',view='device',helpReturn='pause',running=false,active=false,ending=0;
  let names=['玩家 1','GPT'],game=new Game(),inputs=[idle(),idle()],keys=new Set(),last=0,debt=0;
  let stickPointer=null,triggerPointer=null,stickAim=null,stickForce=0,savedKey='tank-arena:last-session:v1';
  let dirty=true;
  new ResizeObserver(()=>{dirty=true;}).observe($('field'));
  function fireEdge(i,down){
    const input=inputs[i];if(input.held===down)return;
    (input.edges ||= []).push(down);input.held=down;
  }
  function readSaved(){try{return JSON.parse(localStorage.getItem(savedKey));}catch{return null;}}
  function save(){
    if(!active)return;
    try{localStorage.setItem(savedKey,JSON.stringify({names:[...names],score:[...game.score],date:Date.now()}));}catch{}
  }
  function resetInput(){
    keys.clear();inputs=[idle(),idle()];stickPointer=null;triggerPointer=null;stickAim=null;stickForce=0;
    $('stick').firstElementChild.style.transform='';$('trigger').classList.remove('down');
    for(const t of game.tanks)if(t.rapid){t.rapid=null;t.item=null;}
  }
  function action(label,fn,cls='action'){
    const b=document.createElement('button');b.className=cls;b.textContent=label;b.onclick=fn;return b;
  }
  function section(title,info){
    running=false;dirty=true;resetInput();panelBody.replaceChildren();
    const h=document.createElement('h1');h.id='panel-title';h.textContent=title;panelBody.append(h);
    if(info){const p=document.createElement('p');p.textContent=info;panelBody.append(p);}
    if(!panel.open)panel.showModal();panel.scrollTop=0;
  }
  function group(cls){const d=document.createElement('div');d.className=cls;panelBody.append(d);return d;}
  function deviceScreen(){
    document.body.classList.remove('mobile');view='device';section('选择游戏设备','选择你的操作方式，进入迷宫对战。');
    const cards=group('cards');
    for(const [type,label,hint] of [['pc','电脑','同屏双人 / 人机'],['mobile','手机','触屏人机对战']]){
      const b=action('',()=>{device=type;document.body.classList.toggle('mobile',type==='mobile');modeScreen();},'card');
      const icon=document.createElement('i');icon.className='device '+type;const strong=document.createElement('b');strong.textContent=label;
      const small=document.createElement('small');small.textContent=hint;b.append(icon,strong,small);cards.append(b);
    }
    const saved=readSaved();
    if(saved && Array.isArray(saved.names)&&Array.isArray(saved.score)){
      const line=group('history');line.textContent='上次对战　'+saved.names[0]+'　'+saved.score[0]+' ∶ '+saved.score[1]+'　'+String(saved.names[1]).replace(/^GPT [低中高]$/,'GPT');
    }
  }
  const difficulties={easy:'简单',medium:'中等',hard:'困难'};
  function modeScreen(){
    view='mode';section(device==='pc'?'选择对战模式':'选择人机对手',device==='pc'?'共用一副键盘，或挑战本地人机。':'左轮盘移动和转向，右侧按钮开火。');
    const list=group('stack');
    if(device==='pc')list.append(action('同屏双人',()=>colorScreen('duel')));
    for(const [key,label] of Object.entries(difficulties))list.append(action('挑战 GPT · '+label,()=>colorScreen(key),key==='hard'?'action primary':'action'));
    panelBody.append(action('← 返回设备选择',deviceScreen,'back'));
  }
  function colorScreen(which){
    view='colors';
    const duel=which==='duel', {swatches}=TankArt;
    section('选择坦克颜色',duel?'为两位玩家选择车身颜色。':'选择你的车身颜色。GPT 使用白色坦克。');
    const selected=['橙',duel?'蓝':'白'],buttons=[];
    for(let id=0;id<(duel?2:1);id++){
      const row=group('color-row'),label=document.createElement('strong');label.textContent=duel?'玩家 '+(id+1):'我的坦克';row.append(label);
      const choices=document.createElement('div');choices.className='swatches';row.append(choices);
      for(const [name,hex] of Object.entries(swatches)){
        const btn=action('',()=>{selected[id]=name;refresh();},'swatch');
        btn.style.setProperty('--paint',hex);btn.title=name+'色';btn.setAttribute('aria-label',label.textContent+' '+name+'色');
        choices.append(btn);buttons.push({id,name,btn});
      }
    }
    function refresh(){for(const {id,name,btn} of buttons){
      btn.setAttribute('aria-pressed',String(name===selected[id]));
      btn.disabled=name===selected[1-id];
    }}
    refresh();panelBody.append(action('开始对战',()=>{
      for(let i=0;i<2;i++)TankArt.colors[i]=swatches[selected[i]];
      document.querySelectorAll('.portrait').forEach((c,i)=>{
        TankArt.drawPortrait(c,i);c.parentElement.style.setProperty('--paint',TankArt.colors[i]);
      });
      start(which);
    },'action primary'),action('← 返回',modeScreen,'back'));
  }
  function play(){
    view='play';panel.close();last=0;debt=0;running=true;resetInput();$('board').focus();
  }
  function start(which){
    mode=which;active=true;ending=0;names=['玩家 1',mode==='duel'?'玩家 2':'GPT'];
    game=new Game({bot:mode!=='duel',difficulty:mode});
    $('touch-controls').hidden=device!=='mobile';$('mode-label').textContent=mode==='duel'?'同屏双人':'本地人机 · '+difficulties[mode];
    $('name0').textContent=names[0];$('name1').textContent=names[1];play();sync();
  }
  function exitMatch(){
    save();active=false;running=false;ending=0;$('touch-controls').hidden=true;document.body.classList.remove('mobile');
    $('mode-label').textContent='迷宫对决';deviceScreen();sync();
  }
  function pause(){
    if(!active)return;view='pause';section('对战暂停',names[0]+'　'+game.score[0]+' ∶ '+game.score[1]+'　'+names[1]);
    const list=group('stack');list.append(action('继续对战',play,'action primary'),action('玩法与道具',()=>guide('pause')),action('保存比分并退出',exitMatch));
  }
  function guide(back){
    helpReturn=back;view='guide';
    section('玩法与道具',device==='mobile'?'左轮盘朝目标方向推动，右手点按开火。':'P1 用 W/S 前进后退、A/D 转向、空格开火。P2 用方向键和回车。');
    const p=document.createElement('p');p.textContent='普通炮每点一发，场上最多五发，十秒后消失。反弹会误伤自己。首辆坦克阵亡后再战 2.5 秒，双亡平局。';panelBody.append(p);
    const dl=document.createElement('dl');dl.className='rules';for(const [key,[name,desc]] of Object.entries(ITEMS)){
      const row=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');
      dt.textContent=name;dd.textContent=key==='rapid'?'按住起转后连续扫射，可边走边转；短点消耗道具。':desc;row.append(dt,dd);dl.append(row);
    }
    panelBody.append(dl,action(back==='pause'?'返回菜单':'继续对战',back==='pause'?pause:play,'action primary'));
  }
  $('menu').onclick=pause;$('guide').onclick=()=>{if(active)guide('play');};
  panel.addEventListener('cancel',e=>{
    e.preventDefault();if(view==='pause')play();else if(view==='guide'){helpReturn==='pause'?pause():play();}
    else if(view==='colors')modeScreen();else if(view==='mode')deviceScreen();
  });
  const binds=new Set(['KeyW','KeyA','KeyS','KeyD','Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','NumpadEnter']);
  const playerFor=k=>k==='Space'?0:(k==='Enter'||k==='NumpadEnter')?1:-1;
  window.addEventListener('keydown',e=>{
    if(!running || e.altKey || e.ctrlKey || e.metaKey)return;
    if(e.code==='Escape'){e.preventDefault();pause();return;}
    if(device!=='pc'||!binds.has(e.code))return;e.preventDefault();
    if(keys.has(e.code)||e.repeat)return;keys.add(e.code);
    const i=playerFor(e.code);if(i>=0 && (i===0||mode==='duel')){fireEdge(i,true);}
  });
  window.addEventListener('keyup',e=>{
    keys.delete(e.code);const i=playerFor(e.code);
    if(i>=0 && running && device==='pc')fireEdge(i,i===1&&(keys.has('Enter')||keys.has('NumpadEnter')));
  });
  function moveStick(e){
    const el=$('stick'),r=el.getBoundingClientRect(),screenX=e.clientX-r.left-r.width/2,screenY=e.clientY-r.top-r.height/2;
    const rotated=matchMedia('(orientation:portrait)').matches;
    const dx=rotated?screenY:screenX,dy=rotated?-screenX:screenY;
    const len=Math.hypot(dx,dy),radius=r.width*.32,j=len>radius?radius/len:1;
    el.firstElementChild.style.transform='translate('+dx*j+'px,'+dy*j+'px)';
    stickForce=clamp((len/radius-.12)/.88,0,1);stickAim=stickForce>0?Math.atan2(dy,dx):null;
  }
  const stick=$('stick'),trigger=$('trigger');
  stick.onpointerdown=e=>{if(!running||stickPointer!==null)return;e.preventDefault();stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e);};
  stick.onpointermove=e=>{if(stickPointer===e.pointerId)moveStick(e);};
  stick.onpointerup=stick.onpointercancel=stick.onlostpointercapture=e=>{
    if(stickPointer!==e.pointerId)return;stickPointer=null;stickForce=0;stickAim=null;stick.firstElementChild.style.transform='';
  };
  trigger.onpointerdown=e=>{
    if(!running||triggerPointer!==null)return;e.preventDefault();triggerPointer=e.pointerId;trigger.setPointerCapture(e.pointerId);
    trigger.classList.add('down');fireEdge(0,true);
  };
  trigger.onpointerup=trigger.onpointercancel=trigger.onlostpointercapture=e=>{
    if(triggerPointer!==e.pointerId)return;triggerPointer=null;fireEdge(0,false);trigger.classList.remove('down');
  };
  for(const el of [stick,trigger])el.oncontextmenu=e=>e.preventDefault();
  function controls(){
    if(device==='mobile'){
      const p=inputs[0];p.aim=stickAim??undefined;
      p.drive=stickAim===null?0:stickForce*Math.max(0,Math.cos(angleDiff(stickAim,game.tanks[0].a)));
    }else{
      inputs[0].drive=Number(keys.has('KeyW'))-Number(keys.has('KeyS'));
      inputs[0].turn=Number(keys.has('KeyD'))-Number(keys.has('KeyA'));
      inputs[1].drive=Number(keys.has('ArrowUp'))-Number(keys.has('ArrowDown'));
      inputs[1].turn=Number(keys.has('ArrowRight'))-Number(keys.has('ArrowLeft'));
    }
  }
  function setText(el,value){if(el.textContent!==value)el.textContent=value;}
  function sync(){
    setText($('round'),String(game.round).padStart(2,'0'));
    for(const t of game.tanks){
      const i=t.id;setText($('score'+i),String(game.score[i]));
      setText($('item'+i),t.alive?(t.item?ITEMS[t.item][0]:''):'阵亡');
      const available=5-game.count(i),ammo=$('ammo'+i);ammo.setAttribute('aria-label','可用普通弹 '+available+' 发');
      for(let j=0;j<5;j++)ammo.children[j].classList.toggle('ready',j<available);
    }
  }
  function frame(now){
    if(running){
      const elapsed=last?Math.min(.1,(now-last)/1000):0;last=now;
      if(ending){
        ending=Math.max(0,ending-elapsed);
        if(!ending){game.newRound();resetInput();debt=0;}
      }else{
        debt+=elapsed;while(debt>=STEP){
          controls();const result=game.step(STEP,inputs);debt-=STEP;
          if(result){ending=.12;save();break;}
        }
      }
      sync();
    }
    if(running||dirty){renderer.draw(game,names);dirty=false;}
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)pause();});
  window.addEventListener('blur',()=>{if(running)pause();});
  window.addEventListener('pagehide',save);
  document.querySelectorAll('.portrait').forEach((c,i)=>TankArt.drawPortrait(c,i));
  for(const i of [0,1])for(let j=0;j<5;j++)$('ammo'+i).append(document.createElement('i'));
  sync();deviceScreen();requestAnimationFrame(frame);
})();

</script>
